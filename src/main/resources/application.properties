spring.application.name=taxis-salta
# =============================================================================
# CONEXIÓN A POSTGRESQL usando Variables de Entorno(DBeaver)
# =============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/taxis_salta_db
spring.datasource.username=${DB_USERNAME:postgres}
# Para la contraseña NO pongo valor por defecto por seguridad.
# Spring Boot obligatoriamente buscará la variable 'DB_PASSWORD'.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# =============================================================================
# Usamos 'validate' porque ya cree el esquema manualmente en DBeaver.
# Hibernate solo verificará que las clases Java coincidan perfectamente
# con las tablas de PostgreSQL, sin modificarlas ni borrarlas.
spring.jpa.hibernate.ddl-auto=validate

# Muestra en la consola de IntelliJ las consultas SQL reales que ejecuta Spring (ideal para debuguear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para optimizar las consultas según las características de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =============================================================================
# CONFIGURACIÓN DE ROUTING (OSRM)
# =============================================================================
routing.osrm.url=https://router.project-osrm.org


whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN}

# =============================================================================
# CONFIGURACIÓN DE WHATSAPP CLOUD API
# =============================================================================
whatsapp.api.url=https://graph.facebook.com
whatsapp.api.version=v26.0
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
# URL de la pagina movil para solicitar viajes
app.pasajero.url=${PASAJERO_WEB_URL:http://localhost:3000}
